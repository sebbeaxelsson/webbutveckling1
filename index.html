<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UFC Fansida</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <h1>UFC Fansida</h1>
  <p>Fighters & Kommande matcher</p>
</header>

<nav>
  <a href="#fighters">Fighters</a>
  <a href="#events">Events</a>
</nav>

<section id="fighters">
  <h2>Kända Fighters</h2>

  <div class="grid">

    <div class="card">
      <img src="https://upload.wikimedia.org/wikipedia/commons/4/4d/Conor_McGregor_2018.jpg" alt="Conor McGregor">
      <h3>Conor McGregor</h3>
    </div>

    <div class="card">
      <img src="https://upload.wikimedia.org/wikipedia/commons/9/9d/Khabib_Nurmagomedov_2017.jpg" alt="Khabib">
      <h3>Khabib Nurmagomedov</h3>
    </div>

    <div class="card">
      <img src="https://upload.wikimedia.org/wikipedia/commons/5/5c/Jon_Jones_2017.jpg" alt="Jon Jones">
      <h3>Jon Jones</h3>
    </div>

  </div>
</section>

<section id="events">
  <h2>Kommande Events</h2>
  <div class="event">
    <p>Kolla riktiga UFC matcher och datum:</p>
    <a href="https://www.ufc.com/events" target="_blank">Se alla events</a>
  </div>
</section>

<footer>
  <p>UFC Projekt | Webbutveckling 1</p>
</footer>

</body>
</html>
